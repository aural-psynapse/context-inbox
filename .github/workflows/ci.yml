name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pipx run ruff==0.8.6 check .
      - run: pipx run ruff==0.8.6 format --check .
      - run: python -m unittest discover -s tests -v
      - run: pipx run --spec shellcheck-py shellcheck runner/*.sh scripts/*.sh
      - run: sh -n runner/run.sh && sh -n runner/fire.sh && sh -n scripts/release.sh

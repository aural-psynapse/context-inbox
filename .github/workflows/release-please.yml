name: release-please

# Starts only by hand while the repo is private: GitHub bills Actions minutes on
# private repos. scripts/release.sh does the same job from a laptop.
# Once the repo is public, switch this back to: push: branches: [main]
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
